name: Daily Renewal Deadlines

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-renewals:
    runs-on: ubuntu-latest
    outputs:
      digest_json: ${{ steps.check.outputs.digest_json }}
      contracts_count: ${{ steps.check.outputs.contracts_count }}
      urgent_count: ${{ steps.check.outputs.urgent_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq 2>&1 | grep -v "^Reading"
          command -v jq >/dev/null || { echo "jq installation failed"; exit 1; }

      - name: Merge extracted contracts into portfolio
        run: |
          set -euo pipefail
          chmod +x extraction/merge_portfolio.sh
          if ! ls extraction/output/*_extracted.json >/dev/null 2>&1; then
            echo "No extracted contracts found in extraction/output/ — nothing to merge."
            echo '[]' > /tmp/master_portfolio_empty.json
            mkdir -p extraction/output
            cp /tmp/master_portfolio_empty.json extraction/output/master_portfolio.json
          else
            bash extraction/merge_portfolio.sh
          fi

      - name: Check renewal/expiry deadlines
        id: check
        run: |
          set -euo pipefail

          echo "→ Scanning portfolio for renewal/expiry deadlines in next 90 days..."

          chmod +x obligations/check_deadlines.sh

          # --dry-run: this step only needs the deterministic candidate list
          # (deadline_alerts_<date>.json). It does NOT call `claude -p` +
          # Slack MCP here — Slack MCP requires a local Claude Code session
          # (see docs/SLACK_MCP_SETUP.md), which GitHub Actions runners don't
          # have. CI posts via the plain Slack webhook in notify-slack below;
          # local/manual runs of check_deadlines.sh (without --dry-run) do
          # the rich MCP-based posting instead.
          if ! bash obligations/check_deadlines.sh --days 90 --dry-run >/dev/null; then
            echo "✗ Failed to check deadlines"
            echo "digest_json=[]" >> $GITHUB_OUTPUT
            echo "contracts_count=0" >> $GITHUB_OUTPUT
            echo "urgent_count=0" >> $GITHUB_OUTPUT
            echo "analysis_json={}" >> $GITHUB_OUTPUT
            exit 1
          fi

          alerts_file="obligations/output/deadline_alerts_$(date -u +%Y-%m-%d).json"
          deadlines_json=$(cat "$alerts_file")

          contracts_count=$(echo "$deadlines_json" | jq 'length')
          urgent_count=$(echo "$deadlines_json" | jq '[.[] | select(.urgency_tier == "URGENT")] | length')

          echo "✓ Found $contracts_count deadline(s) in next 90 days"
          echo "✓ Urgent (<30 days): $urgent_count"

          # Analyze with Claude if there are deadlines due (plain text-mode
          # call, no MCP tools needed — works fine in CI)
          analysis_json="{}"
          if [ "$contracts_count" -gt 0 ]; then
            echo "→ AI Analysis of deadlines..."

            analysis_prompt="Analyze this JSON array of contract renewal/expiry deadlines. Each entry has contract_name, counterparty, contract_type, deadline_type (renewal/expiry), deadline_date, days_until_deadline, urgency_tier (URGENT/ACTION_NEEDED/WATCH), auto_renewal, notice_period_days. Provide a JSON response with: 1) summary (brief overview), 2) critical_actions (array of immediate actions for URGENT items), 3) risk_patterns (any recurring risks or patterns), 4) recommended_process_improvements (how to avoid future deadline misses), 5) priority_focus (which items need immediate attention). Keep responses concise and actionable. Do not invent facts not present in the data."

            analysis_result=$(echo "$deadlines_json" | \
              claude -p "$analysis_prompt" --output-format json 2>/dev/null || echo "{}")

            if echo "$analysis_result" | jq . >/dev/null 2>&1; then
              analysis_json=$(echo "$analysis_result" | jq -r '.result // empty' | jq . 2>/dev/null || echo "{}")
            fi
          fi

          digest_json="$deadlines_json"

          echo "digest_json<<EOF" >> $GITHUB_OUTPUT
          echo "$digest_json" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "analysis_json<<EOF" >> $GITHUB_OUTPUT
          echo "$analysis_json" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "contracts_count=$contracts_count" >> $GITHUB_OUTPUT
          echo "urgent_count=$urgent_count" >> $GITHUB_OUTPUT

          echo "$digest_json" | jq '.' > /tmp/renewals_digest.json
          echo "$analysis_json" | jq '.' > /tmp/renewals_analysis.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate Markdown summary
        id: markdown
        env:
          DIGEST: ${{ steps.check.outputs.digest_json }}
          ANALYSIS: ${{ steps.check.outputs.analysis_json }}
        run: |
          set -euo pipefail

          digest=$(echo "$DIGEST")
          count=$(echo "$digest" | jq 'length')

          if [ "$count" -eq 0 ]; then
            cat > /tmp/full_summary.md <<'EOF'
# ✅ Renewal/Expiry Deadline Check

**Status:** No renewal or expiry deadlines in the next 90 days

All contracts are on track!
EOF
          else
            analysis=$(echo "$ANALYSIS")
            urgent=$(echo "$digest" | jq '[.[] | select(.urgency_tier == "URGENT")] | length')

            {
              echo "# 🔔 Renewal/Expiry Deadline Digest"
              echo ""
              echo "**Deadlines Due:** $count"
              echo "**Urgent (<30 days):** $urgent"
              echo ""
              echo "## 🤖 AI Analysis Summary"
              echo ""
            } > /tmp/summary.md

            summary_text=$(echo "$analysis" | jq -r '.summary // ""' 2>/dev/null)
            [ -n "$summary_text" ] && echo "$summary_text" >> /tmp/summary.md

            critical_actions=$(echo "$analysis" | jq -r '.critical_actions[]? // empty' 2>/dev/null | sed 's/^/- /')
            if [ -n "$critical_actions" ]; then
              echo "" >> /tmp/summary.md
              echo "### Critical Actions Required" >> /tmp/summary.md
              echo "$critical_actions" >> /tmp/summary.md
            fi

            priority_focus=$(echo "$analysis" | jq -r '.priority_focus // ""' 2>/dev/null)
            if [ -n "$priority_focus" ]; then
              echo "" >> /tmp/summary.md
              echo "### Priority Focus" >> /tmp/summary.md
              echo "$priority_focus" >> /tmp/summary.md
            fi

            {
              echo ""
              echo "## 📋 Upcoming Deadlines"
              echo ""
              echo "| Contract | Counterparty | Type | Deadline Type | Deadline Date | Days Left | Tier |"
              echo "|---|---|---|---|---|---|---|"
            } >> /tmp/summary.md

            echo "$digest" | jq -r '.[] | "| \(.contract_name) | \(.counterparty) | \(.contract_type) | \(.deadline_type) | \(.deadline_date) | \(.days_until_deadline) | \(.urgency_tier) |"' >> /tmp/summary.md

            {
              echo ""
              echo "## 🚨 Urgent Items (<30 days)"
              echo ""
            } >> /tmp/summary.md

            echo "$digest" | jq -r '.[] | select(.urgency_tier == "URGENT") | "- **\(.counterparty)** (\(.contract_name), \(.deadline_type)): due **\(.deadline_date)** (in \(.days_until_deadline) days)"' >> /tmp/summary.md

            auto_renew_count=$(echo "$digest" | jq '[.[] | select(.auto_renewal == true)] | length')
            if [ "$auto_renew_count" -gt 0 ]; then
              {
                echo ""
                echo "## 🔄 Auto-Renewal Alert"
                echo ""
                echo "The following contracts **auto-renew** — ensure notices are filed if you do not want renewal:"
              } >> /tmp/summary.md
              echo "$digest" | jq -r '.[] | select(.auto_renewal == true) | "- \(.counterparty) — \(.deadline_date)"' >> /tmp/summary.md
            fi

            improvements=$(echo "$analysis" | jq -r '.recommended_process_improvements[]? // empty' 2>/dev/null | sed 's/^/- /')
            if [ -n "$improvements" ]; then
              {
                echo ""
                echo "## 💡 Process Improvements"
              } >> /tmp/summary.md
              echo "$improvements" >> /tmp/summary.md
            fi

            cat /tmp/summary.md > /tmp/full_summary.md
          fi

          echo "summary<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/full_summary.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Output digest
        env:
          MARKDOWN: ${{ steps.markdown.outputs.summary }}
          COUNT: ${{ steps.check.outputs.contracts_count }}
          URGENT: ${{ steps.check.outputs.urgent_count }}
        run: |
          echo "📊 Daily Renewal/Expiry Digest"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "$MARKDOWN"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Deadlines in next 90 days: $COUNT"
          echo "Urgent (<30 days): $URGENT"

  notify-slack:
    runs-on: ubuntu-latest
    needs: check-renewals
    if: always()
    steps:
      - name: Prepare Slack notification
        id: prepare
        env:
          DIGEST_JSON: ${{ needs.check-renewals.outputs.digest_json }}
          ANALYSIS_JSON: ${{ needs.check-renewals.outputs.analysis_json }}
          COUNT: ${{ needs.check-renewals.outputs.contracts_count }}
          URGENT: ${{ needs.check-renewals.outputs.urgent_count }}
        run: |
          set -euo pipefail

          digest=$(echo "$DIGEST_JSON")
          analysis=$(echo "$ANALYSIS_JSON")

          echo "🔔 Preparing Slack notification..."
          echo "Deadlines due: $COUNT | Urgent: $URGENT"

          if [ "$COUNT" -eq 0 ]; then
            slack_message=$(jq -n \
              --arg status "✅ No renewal/expiry deadlines in next 90 days" \
              '{
                channel: "#legal-contracts",
                icon_emoji: ":calendar:",
                username: "ContractIQ Renewals",
                text: $status,
                attachments: [{
                  color: "good",
                  text: "All contracts are on track. Check back tomorrow."
                }]
              }')
          else
            ai_summary=$(echo "$analysis" | jq -r '.summary // ""' 2>/dev/null)
            priority_focus=$(echo "$analysis" | jq -r '.priority_focus // ""' 2>/dev/null)

            slack_message=$(jq -n \
              --arg count "$COUNT" \
              --arg urgent "$URGENT" \
              --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg ai_summary "$ai_summary" \
              --arg priority_focus "$priority_focus" \
              --argjson digest "$(echo "$digest")" \
              '{
                channel: "#legal-contracts",
                icon_emoji: ":bell:",
                username: "ContractIQ Renewals",
                text: ("🔔 Renewal/Expiry Deadlines — " + $count + " due in next 90 days"),
                attachments: [
                  {
                    color: (if ($urgent | tonumber) > 0 then "danger" else "warning" end),
                    title: "🤖 AI Analysis",
                    text: $ai_summary,
                    short: false
                  },
                  {
                    color: (if ($urgent | tonumber) > 0 then "danger" else "warning" end),
                    title: "Renewal/Expiry Deadlines",
                    text: ("Urgent: " + $urgent + " | Total: " + $count),
                    fields: [
                      {
                        title: "🔴 URGENT (<30 days)",
                        value: ($digest | map(select(.urgency_tier == "URGENT")) | map("• \(.counterparty) (\(.contract_name), \(.deadline_type)): \(.deadline_date)") | join("\n") // "None — all clear"),
                        short: false
                      },
                      {
                        title: "🟠 ACTION NEEDED (30-60 days)",
                        value: ($digest | map(select(.urgency_tier == "ACTION_NEEDED")) | map("• \(.counterparty) (\(.deadline_type)): \(.deadline_date)") | join("\n") // "None"),
                        short: false
                      },
                      {
                        title: "🟡 WATCH (60-90 days)",
                        value: ($digest | map(select(.urgency_tier == "WATCH")) | map("• \(.counterparty) (\(.deadline_type)): \(.deadline_date)") | join("\n") // "None"),
                        short: false
                      },
                      {
                        title: "🔄 Auto-Renewing Contracts",
                        value: ($digest | map(select(.auto_renewal == true)) | map("• \(.counterparty) — \(.deadline_type) date \(.deadline_date)") | join("\n") // "None"),
                        short: false
                      },
                      {
                        title: "⚡ Priority Focus",
                        value: $priority_focus,
                        short: false
                      }
                    ],
                    footer: "Daily scan of extraction/output/master_portfolio.json",
                    ts: ($timestamp | fromdateiso8601)
                  }
                ]
              }')
          fi

          echo "slack_message<<EOF" >> $GITHUB_OUTPUT
          echo "$slack_message" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post to Slack via Webhook
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_MESSAGE: ${{ steps.prepare.outputs.slack_message }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "$SLACK_MESSAGE" | \
            curl -X POST -H 'Content-type: application/json' \
              --data @- \
              "$SLACK_WEBHOOK_URL" && echo "✓ Posted renewal digest to Slack" || echo "✗ Slack post failed"
          else
            echo "⚠️  SLACK_WEBHOOK_URL secret not set — skipping Slack notification"
          fi

  save-artifact:
    runs-on: ubuntu-latest
    needs: check-renewals
    if: always()
    steps:
      - name: Save renewal digest as artifact
        env:
          DIGEST: ${{ needs.check-renewals.outputs.digest_json }}
        run: |
          set -euo pipefail

          mkdir -p renewal-reports
          echo "$DIGEST" | jq '.' > renewal-reports/deadline_alerts_$(date +%Y-%m-%d).json

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: renewal-digest-${{ github.run_id }}
          path: renewal-reports/
          retention-days: 30
